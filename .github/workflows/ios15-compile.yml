# Compile the app for the iOS simulator on every PR into main or release, without signing or running it.
# Pushes to release are not built here: they only carry commits already checked on main or in a PR.
# The same steps as scripts/run-sim.sh up to `xcodebuild build`: fetch nodejs-mobile,
# Python and FFmpeg, build libgit2, assemble the engine tree, generate the project, compile.
# macOS minutes are dear on a private repo: the downloaded / built vendor/ is
# cached by the hash of the script that makes it, and docs-only changes skip.
name: iOS 15.6 backport build

# yg/ios15-backport 专用：把 deploymentTarget 压到 15.6 后编译一次，
# 用编译器的可用性检查（availability）把「哪些 API iOS 15 没有」一次性列全。
# 不签名、不跑模拟器，只 build 到 generic/platform=iOS（arm64）。
# 用法：本地没有 Xcode，所以靠这个 workflow 当编译器；改完推分支即触发。

on:
  push:
    branches: [yg/ios15-backport]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Xcode the app is built with everywhere else: local builds and Xcode Cloud are on
    # Xcode 27, and an older compiler here fails code they accept (it gave up type-checking a
    # long SwiftUI body). `xcode-27` is GitHub's macOS 27 image, a preview for now.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        # The image's default is 27.1; local builds are on 27.2.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      # A path function new to Node would slip past native/root: stop here instead.
      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      # Only the installed slices and the xcframework; the source and build trees stay out.
      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      # Only the xcframework; the download, source and build trees stay out.
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      # The published framework, or a build from source when native/ffmpeg changed since.
      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      # The vendored xcframeworks are arm64 only; a generic destination would add x86_64.
      # 回退验证：目标 iOS 设备，deployment target 15.6，只编 arm64，不签名。
      # 错误信息里带 "is only available in iOS 16.0 or newer" 的行就是待办清单。
      - name: Compile (iOS 15.6 device, no signing)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 \
            build > /tmp/ios15-build.log 2>&1 || true
          echo "==== 待办归并：is only available ===="
          grep -hoE "'[^']+' is only available in iOS [0-9.]+ or newer" /tmp/ios15-build.log | sort | uniq -c | sort -rn | head -60 || true
          echo "==== 错误文件清单 ===="
          grep -hoE "/[^ ]+\.swift:[0-9]+:[0-9]+: error:" /tmp/ios15-build.log | sed 's|.*/app/|app/|' | cut -d: -f1 | sort | uniq -c | sort -rn | head -40 || true
          echo "==== error 明细（前 200 行，去掉 runner 的绝对路径）===="
          grep -E ": error: " /tmp/ios15-build.log | sed 's|.*/app/|app/|' | sort -u | head -200 || true
          echo "==== 日志尾部 40 行 ===="
          tail -40 /tmp/ios15-build.log || true
          errors=$(grep -cE ": error: " /tmp/ios15-build.log || true)
          echo "==== error 行数: ${errors:-0} ===="
          [ "${errors:-0}" -eq 0 ]

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-build-log
          path: /tmp/ios15-build.log
          if-no-files-found: ignore
